plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.vpn.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.vpn.app"
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = 1
        versionName = "1.0.0"
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

// amneziawg-android 2.3.7 (via Gradle metadata / hevtunnel / okhttp 5.3)
// otherwise resolves androidx.core 1.17 (compileSdk 36 / AGP 8.9+) and
// kotlin-stdlib 2.2.21 (metadata 2.2.0, unreadable by Kotlin 1.9).
// Flutter 3.24 still compiles against API 34 / AGP 8.1 / Kotlin 1.9.
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.13.1'
        force 'androidx.core:core-ktx:1.13.1'
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24'
        force 'androidx.collection:collection:1.4.4'
        force 'androidx.annotation:annotation:1.8.2'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation('com.zaneschepke:amneziawg-android:2.3.7') {
        exclude group: 'com.squareup.okhttp3', module: 'okhttp'
        exclude group: 'com.squareup.okhttp3', module: 'okhttp-dnsoverhttps'
        exclude group: 'com.zaneschepke', module: 'hevtunnel'
    }
    implementation 'com.getkeepsafe.relinker:relinker:1.4.5'
}

flutter {
    source = "../.."
}
